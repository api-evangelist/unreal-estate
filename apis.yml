description: Unreal Estate (formerly USRealty.com) is a tech-enabled flat-fee real estate
  marketplace and brokerage that lets home sellers list on their local MLS without paying
  a traditional listing commission, with flat-fee plans ranging from $0 to $449 upfront
  plus 0.5% at closing, available nationwide except South Dakota. The company also offers
  buyer services, rental listings with cash rebates, and AI-powered market intelligence,
  and was acquired by Abode in November 2024. Unreal Estate publishes no public developer
  program or API.
